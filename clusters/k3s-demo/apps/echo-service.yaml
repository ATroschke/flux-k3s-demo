apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-service
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-service
  template:
    metadata:
      labels:
        app: echo-service
    spec:
      containers:
        - name: echo-service
          image: ghcr.io/atroschke/echo-service:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "tempo.monitoring:4317"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: echo-service
  namespace: apps
  labels:
    app: echo-service
spec:
  selector:
    app: echo-service
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-service
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: echo.fanfuse.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-service
                port:
                  name: http
  tls:
    - secretName: echo-fanfuse-tls
      hosts:
        - echo.fanfuse.app
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: echo-service
  namespace: apps
  labels:
    app: echo-service
spec:
  selector:
    matchLabels:
      app: echo-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
